<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de acessibilidade para Provas</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
        background-color: #d4f1f4;
        color: #12343b;
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        max-width: 700px;
        margin: 0;
        color: #0b4f6c;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.15;
        text-align: center;
      }

      .card {
        width: min(100%, 520px);
        padding: 2rem;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(11, 79, 108, 0.18);
      }

      form {
        display: grid;
        gap: 1.25rem;
      }

      label {
        color: #163f4b;
        font-size: 1.15rem;
        font-weight: 700;
      }

      input[type="file"] {
        width: 100%;
        padding: 0.75rem;
        border: 2px dashed #4aa3b7;
        border-radius: 12px;
        background: #f4fdff;
        color: #163f4b;
        cursor: pointer;
        font: inherit;
      }

      input[type="file"]::file-selector-button {
        margin-right: 0.8rem;
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: #0b4f6c;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button {
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        background: #087f8c;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 1.1rem;
        font-weight: 700;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: #05636d;
        transform: translateY(-2px);
      }

      button:focus-visible,
      input[type="file"]:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #mensagem {
        min-height: 1.25rem;
        margin: 0;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Sistema de acessibilidade para Provas</h1>

    <main class="card">
      <form id="formProva">
        <label for="pdfInput">Anexe o arquivo da prova</label>
        <input type="file" id="pdfInput" accept="application/pdf" required />
        <button type="submit">Processar Prova</button>
        <p id="mensagem" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const formProva = document.querySelector('#formProva');
      const pdfInput = document.querySelector('#pdfInput');
      const mensagem = document.querySelector('#mensagem');
      const botao = formProva.querySelector('button');

      formProva.addEventListener('submit', async (e) => {
        e.preventDefault();

        const arquivo = pdfInput.files[0];
        if (!arquivo) {
          mensagem.textContent = 'Selecione um arquivo PDF para continuar.';
          return;
        }

        const formData = new FormData();
        formData.append('arquivo', arquivo);
        botao.disabled = true;
        mensagem.textContent = 'Enviando prova...';

        try {
          const resposta = await fetch('/api/upload-pdf', {
            method: 'POST',
            body: formData
          });

          const dados = await resposta.json();
          if (!resposta.ok) throw new Error(dados.erro || 'Não foi possível processar a prova.');

          mensagem.textContent = dados.message || 'Prova enviada com sucesso.';
          formProva.reset();
        } catch (erro) {
          mensagem.textContent = erro.message || 'Ocorreu um erro ao enviar a prova.';
        } finally {
          botao.disabled = false;
        }
      });
    </script>
  </body>
</html>
