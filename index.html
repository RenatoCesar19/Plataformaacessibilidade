<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAI — Plataforma de Avaliação Inclusiva</title>
    <style>
      :root {
        --azul-bebe: #d4f1f4;
        --azul-escuro: #075574;
        --azul-medio: #087f8c;
        --texto: #12343b;
        --branco: #ffffff;
        --erro: #a61b1b;
        --sombra: 0 12px 30px rgba(11, 79, 108, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--azul-bebe);
        color: var(--texto);
        font-family: Arial, Helvetica, sans-serif;
      }

      button, input, select { font: inherit; }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        padding: 0.8rem 1.1rem;
        background: var(--azul-medio);
        color: var(--branco);
        cursor: pointer;
        font-weight: 700;
      }

      button:hover { background: var(--azul-escuro); }
      button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 4px solid #f59e0b;
        outline-offset: 3px;
      }

      .tela {
        min-height: 100vh;
        padding: 2rem;
      }

      .centralizada {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        text-align: center;
      }

      .titulo-principal {
        max-width: 780px;
        margin: 0;
        color: var(--azul-escuro);
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      .card {
        width: min(100%, 620px);
        padding: 2rem;
        border-radius: 20px;
        background: var(--branco);
        box-shadow: var(--sombra);
        text-align: left;
      }

      .acoes-perfil { display: grid; gap: 1rem; width: min(100%, 400px); }
      .botao-grande { min-height: 64px; font-size: 1.2rem; }

      form { display: grid; gap: 1.1rem; }
      label { display: grid; gap: 0.45rem; font-weight: 700; }

      input[type="text"], input[type="password"], input[type="file"], select {
        width: 100%;
        min-height: 46px;
        border: 2px solid #78bbc7;
        border-radius: 9px;
        padding: 0.65rem;
        background: #f8feff;
        color: var(--texto);
      }

      .dashboard {
        width: min(1200px, 100%);
        margin: 0 auto;
      }

      .cabecalho-dashboard {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .cabecalho-dashboard h1 { margin: 0; color: var(--azul-escuro); }
      .layout-dashboard { display: grid; grid-template-columns: 230px 1fr; gap: 1.5rem; }
      .menu { display: grid; align-content: start; gap: 0.7rem; }
      .menu button { text-align: left; }
      .conteudo { min-height: 420px; }
      .conteudo h2 { margin-top: 0; color: var(--azul-escuro); }

      .tabela { width: 100%; border-collapse: collapse; }
      .tabela th, .tabela td { padding: 0.8rem; border-bottom: 1px solid #b9dde2; text-align: left; }
      .tabela th { background: #e9fbfd; }

      .lista-provas { display: grid; gap: 1rem; }
      .item-prova { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem; border: 2px solid #b9dde2; border-radius: 12px; }
      .item-prova h3 { margin: 0 0 0.4rem; }
      .item-prova p { margin: 0; }

      .adaptacoes { display: grid; gap: 0.65rem; }
      .adaptacoes label { display: flex; align-items: center; gap: 0.6rem; font-weight: 400; }
      .adaptacoes input { width: 20px; height: 20px; }
      .mensagem-sucesso { min-height: 1.4rem; color: #056b3c; font-weight: 700; }
      .vazio { padding: 1rem; border-radius: 10px; background: #e9fbfd; }
      .oculto { display: none !important; }

      @media (max-width: 720px) {
        .tela { padding: 1rem; }
        .cabecalho-dashboard, .item-prova { align-items: stretch; flex-direction: column; }
        .layout-dashboard { grid-template-columns: 1fr; }
        .menu { grid-template-columns: 1fr 1fr; }
        .tabela { font-size: 0.9rem; }
      }
    </style>
  </head>
  <body>
    <!-- Tela 1: escolha do perfil -->
    <section id="telaPerfil" class="tela centralizada">
      <h1 class="titulo-principal">Sistema de acessibilidade para Provas</h1>
      <p>Escolha como deseja acessar a plataforma.</p>
      <div class="acoes-perfil">
        <button class="botao-grande" type="button" data-perfil="professor">Sou Professor</button>
        <button class="botao-grande" type="button" data-perfil="aluno">Sou Aluno</button>
      </div>
    </section>

    <!-- Tela 2: login compartilhado pelos dois perfis -->
    <section id="telaLogin" class="tela centralizada oculto">
      <div class="card">
        <h1 id="tituloLogin">Login</h1>
        <form id="formLogin">
          <label>Usuário <input id="usuarioLogin" type="text" autocomplete="username" required /></label>
          <label>Senha <input id="senhaLogin" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
          <button id="voltarPerfil" type="button">Voltar</button>
        </form>
      </div>
    </section>

    <!-- Tela 3: dashboard do professor -->
    <section id="telaProfessor" class="tela oculto">
      <div class="dashboard">
        <header class="cabecalho-dashboard">
          <div>
            <h1>Área do Professor</h1>
            <p>Olá, Renato. Gerencie e atribua avaliações.</p>
          </div>
          <button class="sair" type="button">Sair</button>
        </header>
        <div class="layout-dashboard">
          <nav class="menu" aria-label="Menu do professor">
            <button type="button" data-aba="lista">Provas Cadastradas</button>
            <button type="button" data-aba="cadastro">Cadastrar Nova Prova</button>
          </nav>
          <main class="conteudo">
            <section id="abaLista" class="card">
              <h2>Provas Cadastradas</h2>
              <div id="tabelaProvas"></div>
            </section>
            <section id="abaCadastro" class="card oculto">
              <h2>Cadastrar Nova Prova</h2>
              <form id="formNovaProva">
                <label>Anexe o arquivo da prova
                  <input id="arquivoProva" type="file" accept="application/pdf" required />
                </label>
                <label>Aluno alvo
                  <select id="alunoAlvo" required></select>
                </label>
                <fieldset class="adaptacoes">
                  <legend>Adaptações necessárias</legend>
                  <label><input type="checkbox" name="adaptacao" value="Fonte Ampliada" /> Fonte Ampliada</label>
                  <label><input type="checkbox" name="adaptacao" value="Alto Contraste" /> Alto Contraste</label>
                  <label><input type="checkbox" name="adaptacao" value="Leitura de Tela" /> Leitura de Tela</label>
                </fieldset>
                <button type="submit">Salvar e Atribuir Prova</button>
                <p id="mensagemCadastro" class="mensagem-sucesso" role="status" aria-live="polite"></p>
              </form>
            </section>
          </main>
        </div>
      </div>
    </section>

    <!-- Tela 4: dashboard do aluno -->
    <section id="telaAluno" class="tela oculto">
      <div class="dashboard">
        <header class="cabecalho-dashboard">
          <div>
            <h1>Olá, Renato!</h1>
            <p>Estas são as provas atribuídas a você.</p>
          </div>
          <button class="sair" type="button">Sair</button>
        </header>
        <main class="card">
          <h2>Minhas Provas</h2>
          <div id="provasAluno" class="lista-provas"></div>
        </main>
      </div>
    </section>

    <script>
      // Banco de dados temporário usado somente neste protótipo.
      const alunos = [
        { id: 1, nome: 'Renato' },
        { id: 2, nome: 'Ana Souza' },
        { id: 3, nome: 'Carlos Lima' }
      ];

      const provas = [
        {
          id: 1,
          titulo: 'Avaliação de Ciências',
          alunoId: 1,
          adaptacoes: ['Fonte Ampliada', 'Alto Contraste']
        }
      ];

      let perfilSelecionado = '';
      const telas = document.querySelectorAll('.tela');

      function mostrarTela(idTela) {
        telas.forEach((tela) => tela.classList.add('oculto'));
        document.querySelector(idTela).classList.remove('oculto');
      }

      function obterAluno(id) {
        return alunos.find((aluno) => aluno.id === Number(id));
      }

      function renderizarTabelaProvas() {
        const destino = document.querySelector('#tabelaProvas');
        if (!provas.length) {
          destino.innerHTML = '<p class="vazio">Nenhuma prova cadastrada.</p>';
          return;
        }

        destino.innerHTML = `
          <table class="tabela">
            <thead><tr><th>Prova</th><th>Aluno</th><th>Adaptações</th></tr></thead>
            <tbody>
              ${provas.map((prova) => `
                <tr>
                  <td>${prova.titulo}</td>
                  <td>${obterAluno(prova.alunoId).nome}</td>
                  <td>${prova.adaptacoes.length ? prova.adaptacoes.join(', ') : 'Nenhuma'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function preencherSelectAlunos() {
        document.querySelector('#alunoAlvo').innerHTML = alunos
          .map((aluno) => `<option value="${aluno.id}">${aluno.nome}</option>`)
          .join('');
      }

      function renderizarProvasDoAluno() {
        const destino = document.querySelector('#provasAluno');
        const provasRenato = provas.filter((prova) => prova.alunoId === 1);
        if (!provasRenato.length) {
          destino.innerHTML = '<p class="vazio">Você não possui provas atribuídas no momento.</p>';
          return;
        }

        destino.innerHTML = provasRenato.map((prova) => `
          <article class="item-prova">
            <div>
              <h3>${prova.titulo}</h3>
              <p>Adaptações: ${prova.adaptacoes.length ? prova.adaptacoes.join(', ') : 'Nenhuma'}</p>
            </div>
            <button type="button" data-iniciar="${prova.id}">Iniciar Prova</button>
          </article>
        `).join('');

        destino.querySelectorAll('[data-iniciar]').forEach((botao) => {
          botao.addEventListener('click', () => alert('Prova iniciada! Este é um protótipo de navegação.'));
        });
      }

      function mostrarAbaProfessor(aba) {
        document.querySelector('#abaLista').classList.toggle('oculto', aba !== 'lista');
        document.querySelector('#abaCadastro').classList.toggle('oculto', aba !== 'cadastro');
        if (aba === 'lista') renderizarTabelaProvas();
      }

      // Seleção de perfil e login com credenciais de teste.
      document.querySelectorAll('[data-perfil]').forEach((botao) => {
        botao.addEventListener('click', () => {
          perfilSelecionado = botao.dataset.perfil;
          document.querySelector('#tituloLogin').textContent = `Login do ${perfilSelecionado === 'professor' ? 'Professor' : 'Aluno'}`;
          mostrarTela('#telaLogin');
          document.querySelector('#usuarioLogin').focus();
        });
      });

      document.querySelector('#voltarPerfil').addEventListener('click', () => mostrarTela('#telaPerfil'));

      document.querySelector('#formLogin').addEventListener('submit', (evento) => {
        evento.preventDefault();
        const usuario = document.querySelector('#usuarioLogin').value.trim();
        const senha = document.querySelector('#senhaLogin').value;
        if (usuario !== 'Renato' || senha !== '1234') {
          alert('Usuário ou senha incorretos. Use Renato e 1234 para testar.');
          return;
        }

        evento.currentTarget.reset();
        if (perfilSelecionado === 'professor') {
          renderizarTabelaProvas();
          mostrarAbaProfessor('lista');
          mostrarTela('#telaProfessor');
        } else {
          renderizarProvasDoAluno();
          mostrarTela('#telaAluno');
        }
      });

      // Navegação e cadastro do professor.
      document.querySelectorAll('[data-aba]').forEach((botao) => {
        botao.addEventListener('click', () => mostrarAbaProfessor(botao.dataset.aba));
      });

      document.querySelector('#formNovaProva').addEventListener('submit', (evento) => {
        evento.preventDefault();
        const arquivo = document.querySelector('#arquivoProva').files[0];
        const alunoId = Number(document.querySelector('#alunoAlvo').value);
        const adaptacoes = [...document.querySelectorAll('input[name="adaptacao"]:checked')].map((input) => input.value);

        provas.push({
          id: Date.now(),
          titulo: arquivo.name.replace(/\.pdf$/i, ''),
          alunoId,
          adaptacoes
        });

        evento.currentTarget.reset();
        preencherSelectAlunos();
        document.querySelector('#mensagemCadastro').textContent = 'Prova salva e atribuída com sucesso!';
        renderizarTabelaProvas();
        mostrarAbaProfessor('lista');
      });

      document.querySelectorAll('.sair').forEach((botao) => {
        botao.addEventListener('click', () => {
          perfilSelecionado = '';
          mostrarTela('#telaPerfil');
        });
      });

      preencherSelectAlunos();
    </script>
  </body>
</html>
