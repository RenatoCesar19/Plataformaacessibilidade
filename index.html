<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Avaliação Acadêmica Inclusiva</title>
    <style>
      :root {
        --azul-login: #4ac2fa;
        --branco: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: var(--azul-login);
        color: var(--branco);
        font-family: Arial, Helvetica, sans-serif;
      }

      .login-form {
        width: min(100%, 360px);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .logo {
        width: 120px;
        height: auto;
        margin: 0 auto 30px;
        object-fit: contain;
      }

      h1 {
        margin: 0 0 2rem;
        color: var(--branco);
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      .campo {
        position: relative;
        margin-bottom: 1rem;
      }

      .campo svg {
        position: absolute;
        top: 50%;
        left: 1rem;
        width: 20px;
        height: 20px;
        transform: translateY(-50%);
        fill: var(--branco);
        pointer-events: none;
      }

      input {
        width: 100%;
        min-height: 52px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 10px;
        padding: 0.85rem 1rem 0.85rem 3rem;
        outline: none;
        background-color: transparent;
        color: #ffffff;
        font-size: 1rem;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      input::placeholder { color: #ffffff; opacity: 0.9; }

      input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35);
      }

      button {
        min-height: 52px;
        margin-top: 0.5rem;
        border: 0;
        border-radius: 10px;
        background: #ffffff;
        color: #4ac2fa;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.08em;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      button:hover {
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16);
        transform: translateY(-2px);
      }

      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }

      .esqueceu-senha {
        align-self: center;
        margin-top: 1.25rem;
        color: #ffffff;
        font-size: 0.9rem;
        text-decoration: none;
      }

      .esqueceu-senha:hover { text-decoration: underline; }
      .mensagem { min-height: 1.25rem; margin: 1rem 0 0; font-weight: 700; }

      /* Modo de alto contraste: remove o azul e reforça os elementos interativos. */
      body.alto-contraste { background: #000000; }
      body.alto-contraste input {
        border: 3px solid #ffff00;
        color: #ffffff;
      }
      body.alto-contraste input:focus { box-shadow: 0 0 0 4px #ffffff; }
      body.alto-contraste button {
        background: #ffff00;
        color: #000000;
      }
      body.alto-contraste .campo svg { fill: #ffff00; }
      body.alto-contraste button:focus-visible,
      body.alto-contraste input:focus-visible,
      body.alto-contraste a:focus-visible { outline-color: #ffff00; }

      /* Aumenta proporcionalmente textos e controles, sem alterar a estrutura. */
      body.fonte-ampliada { font-size: 1.2em; }
      body.fonte-ampliada input, body.fonte-ampliada button { min-height: 60px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <form class="login-form" id="formLogin">
        <img class="logo" src="image_52a27c.png" alt="Logotipo da Plataforma de Avaliação Inclusiva" />
        <h1>Avaliação Acadêmica Inclusiva</h1>

        <label class="campo">
          <span class="sr-only">Nome de usuário</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5Z" /></svg>
          <input id="usuario" type="text" autocomplete="username" placeholder="Usuário" required />
        </label>

        <label class="campo">
          <span class="sr-only">Senha</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-7a3 3 0 0 0-3-3Zm-7-2a2 2 0 1 1 4 0v2h-4V7Zm3 9.73V19h-2v-2.27A2 2 0 1 1 13 16.73Z" /></svg>
          <input id="senha" type="password" autocomplete="current-password" placeholder="Senha" required />
        </label>

        <button type="submit">LOGIN</button>
        <a class="esqueceu-senha" href="#recuperar-senha">Esqueceu a senha?</a>
        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      document.querySelector('#formLogin').addEventListener('submit', (evento) => {
        evento.preventDefault();
        document.querySelector('#mensagem').textContent = 'Login enviado com sucesso.';
      });
    </script>
  </body>
</html>
